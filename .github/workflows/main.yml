name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*' # Trigger deploy hanya saat push tag seperti v1.0.0
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ==================== ANDROID LINT ====================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            core/**/build/reports/lint-results-debug.html
            features/**/build/reports/lint-results-debug.html
          retention-days: 7

  # ==================== UNIT TESTS ====================
  unit-test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ==================== INSTRUMENTATION TESTS ====================
  instrumentation-test:
    name: Instrumentation Tests
    needs: [unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build app
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest

      - name: List APK files
        run: find . -name "*.apk" -type f

      - name: Run tests
        uses: emulator-wtf/run-tests@v0
        with:
          api-token: ${{ secrets.WTF_EMULATOR }}
          app: app/build/outputs/apk/development/debug/app-development-debug.apk
          test: app/build/outputs/apk/androidTest/development/debug/app-development-debug-androidTest.apk
          outputs-dir: build/test-results

      - name: Publish test report
        uses: mikepenz/action-junit-report@v2
        if: always()
        with:
          report_paths: 'build/test-results/**/*.xml'

  # ==================== SONARQUBE ANALYSIS ====================
  sonarqube:
    name: SonarQube Analysis
    needs: [unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Tests for Coverage
        run: ./gradlew testDebugUnitTest jacocoAllModulesReport jacocoAllModulesVerification

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-lint-report
          path: |
            **/build/reports/lint-results-debug.xml
            **/build/reports/lint-results-*Debug.xml
          retention-days: 7

      - name: SonarQube Scan
        run: ./gradlew sonarqube -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==================== BUILD AAB (bukan APK) ====================
  build:
    name: Build AAB
    needs: [unit-test, instrumentation-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        flavor: [development, staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare flavor name
        run: echo "FLAVOR_CAP=$(echo ${{ matrix.flavor }} | sed 's/.*/\u&/')" >> $GITHUB_ENV

      # ---------- Build APK untuk development & staging ----------
      - name: Build Debug APK (non-production)
        if: matrix.flavor != 'production'
        run: ./gradlew assemble${{ env.FLAVOR_CAP }}Debug --stacktrace

      - name: Upload Debug APK
        if: matrix.flavor != 'production'
        uses: actions/upload-artifact@v4
        with:
          name: zypos-${{ matrix.flavor }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 14

      # ---------- Build AAB untuk production ----------
      - name: Create Keystore
        if: matrix.flavor == 'production'
        uses: timheuer/base64-to-file@v1
        id: keystore
        with:
          fileName: "release.keystore"
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Build Release AAB (production)
        if: matrix.flavor == 'production'
        run: ./gradlew bundle${{ env.FLAVOR_CAP }}Release --stacktrace
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release AAB
        if: matrix.flavor == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: zypos-production-release.aab
          path: app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 30

  # ==================== DEPLOY TO PLAY STORE ====================
  # Deploy HANYA jalan saat push tag (v*), bukan push biasa ke main.
  # Ditambah environment approval sebagai safety net.
  #
  # Flow aman:
  #   1. Push/merge ke main   → lint, test, build jalan (deploy TIDAK jalan)
  #   2. Yakin mau deploy?    → git tag v1.0.0 && git push origin v1.0.0
  #   3. Tag trigger workflow  → test jalan lagi → deploy MENUNGGU approval
  #   4. Klik "Approve" di GitHub Actions → baru deploy ke Play Store
  deploy:
    name: Deploy to Play Store
    needs: [build, sonarqube]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20

    # --- SAFETY NET: Manual Approval ---
    # Setup di GitHub: Settings → Environments → "production"
    # → Aktifkan "Required reviewers" → Tambahkan reviewer
    environment:
      name: production
      url: https://play.google.com/store/apps/details?id=dev.faizal.zypos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Grant execute permission
        run: chmod +x gradlew

      # Download AAB dari job build (tidak perlu build ulang)
      - name: Download Production AAB
        uses: actions/download-artifact@v4
        with:
          name: zypos-production-release.aab
          path: app/build/outputs/bundle/productionRelease/

      - name: Verify AAB exists
        run: |
          echo "=== AAB Files ==="
          find . -name "*.aab" -type f
          if [ -z "$(find . -name '*.aab' -type f)" ]; then
            echo "ERROR: No AAB file found!"
            exit 1
          fi

      # Create Service Account Key file
      - name: Create Service Account Key
        uses: timheuer/base64-to-file@v1
        id: service_account_json
        with:
          fileName: "service-account.json"
          encodedString: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY }}

      # Deploy with Fastlane
      - name: Deploy to Play Store
        run: bundle exec fastlane android deploy
        env:
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          GPLAY_SERVICE_ACCOUNT_KEY: ${{ steps.service_account_json.outputs.filePath }}

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 30